[package]
name = "lp-zap"
version = "0.1.0"
edition = "2021"
publish = false
description = "Venue-agnostic, stateless, PDA-less atomic transaction composer (Pinocchio)"

[lib]
name = "lp_zap"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
# Pinned to the house version (aggregator-lst-deploy) to avoid toolchain surprises.
pinocchio = { version = "=0.11.2", default-features = false, features = ["cpi", "copy"] }
# Pinocchio 0.11 re-exports solana-address as `pinocchio::address`; the `decode`
# feature enables the `declare_id!` / `from_str_const` base58 constants.
solana-address = { version = "2", features = ["decode"] }

# Host-only: `Address::find_program_address` needs the curve25519 implementation
# off-chain (on-chain it is a syscall). Never compiled into the SBF binary.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["decode", "curve25519"] }

[dev-dependencies]
mollusk-svm = "=0.15.1"
mollusk-svm-programs-token = "=0.15.1"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"
solana-program-error = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
